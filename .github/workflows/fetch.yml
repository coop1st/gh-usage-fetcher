name: Fetch usage snapshot
on:
  schedule:
    # Feeds the Friday 18:00 Dublin report. Three slots because scheduled runs
    # on this account have started 5-8 hours late; any one landing is enough.
    - cron: "0 20 * * 4"
    - cron: "0 2 * * 5"
    - cron: "0 8 * * 5"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency: fetch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python fetch_usage.py
        env:
          USAGE_TOKEN: ${{ secrets.USAGE_TOKEN }}
      # GitHub disables schedules in public repos after 60 days without
      # activity; re-enabling the workflow resets that clock.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          curl -s -o /dev/null -w "keepalive %{http_code}\n" -X PUT
          -H "Authorization: Bearer $GH_TOKEN"
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/fetch.yml/enable
